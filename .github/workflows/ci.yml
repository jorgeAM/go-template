name: CI

on:
  pull_request:
    branches: ["main", "dev"]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
        - name: Check out code into Go module directory
          uses: actions/checkout@v4

        - name: Setup Go
          uses: actions/setup-go@v5
          with:
            go-version-file: go.mod
        
        - name: Cache modules
          uses: actions/cache@v4
          with:
            path: |
              ~/.cache/go-build
              ~/go/pkg/mod
            key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
            restore-keys: |
              ${{ runner.os }}-go-

        - name: Verify deps tidy
          run: go mod download && git diff --exit-code go.mod go.sum

        - name: Tests
          run: go test -v ./...